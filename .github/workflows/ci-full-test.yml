name: QLBV CI - Full Stack Verification (DTB + BE + FE)

on:
  push:
    branches:
      - main
      - dev
      - chinh-sua-ui
      - "feat/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres123@127.0.0.1:5432/hospital_db?schema=public
  FRONTEND_URL: http://localhost:3000
  JWT_SECRET: ci-hospital-management-jwt-secret-2026
  JWT_EXPIRES_IN: 1d
  NEXT_PUBLIC_API_URL: http://localhost:3001/api

jobs:
  # ==========================================================================
  # 1. DATABASE (PostgreSQL 16 + Prisma) & BACKEND (NestJS Build, Unit, E2E)
  # ==========================================================================
  dtb-and-backend:
    name: DTB & Backend (Prisma + PostgreSQL + NestJS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: hospital_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hospital_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install PostgreSQL client (psql)
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: "[DTB] Validate Prisma schema & generate client"
        working-directory: backend
        run: |
          npx prisma validate
          npx prisma generate

      - name: "[DTB] Apply database migrations / schema"
        working-directory: backend
        run: |
          if [ -d prisma/migrations ] && [ "$(ls -A prisma/migrations)" ]; then
            npx prisma migrate deploy
            npx prisma migrate status
          else
            npx prisma db push --skip-generate
          fi

      - name: "[DTB] Run seed twice (verify idempotency)"
        working-directory: backend
        run: |
          npm run prisma:seed
          npm run prisma:seed

      - name: "[DTB] Verify tables, derived VIEWs, triggers & seed counts"
        working-directory: backend
        run: |
          PSQL_URL="${DATABASE_URL%%\?*}"
          if [ -d prisma/migrations ] && [ "$(ls -A prisma/migrations)" ]; then
            psql "$PSQL_URL" -v ON_ERROR_STOP=1 \
              -c "DO \$\$ DECLARE tbl_count INT; view_count INT; trig_count INT; BEGIN SELECT COUNT(*) INTO tbl_count FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE' AND table_name IN ('KHOA','PHONG','GIUONG_BENH','NHAN_VIEN','BAC_SI','DIEU_DUONG','KY_THUAT_VIEN','BENH_NHAN','THE_BHYT','DOT_NOI_TRU','PHAN_GIUONG','LUOT_KHAM','DON_THUOC','THUOC','CHI_TIET_DON_THUOC','LOAI_XET_NGHIEM','PHIEU_XET_NGHIEM','VIEN_PHI'); IF tbl_count <> 18 THEN RAISE EXCEPTION 'Expected 18 v2 tables, found %', tbl_count; END IF; SELECT COUNT(*) INTO view_count FROM information_schema.views WHERE table_schema = 'public' AND table_name IN ('V_NHAN_VIEN','V_BENH_NHAN','V_DON_THUOC','V_LUOT_KHAM_CHI_PHI','V_VIEN_PHI'); IF view_count <> 5 THEN RAISE EXCEPTION 'Expected 5 v2 derived views, found %', view_count; END IF; SELECT COUNT(DISTINCT trigger_name) INTO trig_count FROM information_schema.triggers WHERE trigger_schema = 'public'; IF trig_count < 10 THEN RAISE EXCEPTION 'Expected at least 10 triggers, found %', trig_count; END IF; END \$\$;" \
              -c 'SELECT COUNT(*) AS so_nhan_vien, MIN("SoNamCongTac") AS min_tham_nien FROM "V_NHAN_VIEN";' \
              -c 'SELECT COUNT(*) AS so_benh_nhan, MIN("Tuoi") AS min_tuoi FROM "V_BENH_NHAN";' \
              -c 'SELECT COUNT(*) AS so_don_thuoc, COALESCE(SUM("TongTienThuoc"), 0) AS tong_tien_thuoc FROM "V_DON_THUOC";' \
              -c 'SELECT COUNT(*) AS so_hoa_don, COALESCE(SUM("ThucThu"), 0) AS tong_thuc_thu FROM "V_VIEN_PHI";'
          else
            psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) AS public_tables FROM information_schema.tables WHERE table_schema = 'public';"
          fi

      - name: "[BE] Build NestJS application"
        working-directory: backend
        run: npm run build

      - name: "[BE] Run Jest unit tests"
        working-directory: backend
        run: npm test -- --runInBand

      - name: "[BE] Run Jest E2E tests (BR-V2 & API Integration)"
        working-directory: backend
        run: npm run test:e2e -- --runInBand

  # ==========================================================================
  # 2. FRONTEND (Next.js TypeScript, ESLint, Production Build & v2 Hygiene)
  # ==========================================================================
  frontend:
    name: Frontend (Typecheck, Lint & Production Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: "[FE] TypeScript strict check (tsc --noEmit)"
        working-directory: frontend
        run: npx tsc --noEmit

      - name: "[FE] ESLint check (zero warnings & errors)"
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      - name: "[FE] Next.js production build"
        working-directory: frontend
        run: npm run build

      - name: "[FE] Verify v2 route hygiene"
        run: |
          if [ -f docs/API_Contract_v2.md ] && [ -d "frontend/src/app/(pharmacy)" ]; then
            echo "Deprecated v1 /pharmacy route still exists in v2 codebase!"
            exit 1
          fi
          echo "Frontend v2 route hygiene OK."

  # ==========================================================================
  # 3. FULL-STACK INTEGRATION (PostgreSQL + Backend :3001 + Frontend :3000)
  # ==========================================================================
  fullstack-integration:
    name: Full-Stack Integration (DB + BE + FE Live E2E)
    needs:
      - dtb-and-backend
      - frontend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: hospital_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hospital_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies (backend & frontend)
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Prepare database (generate, migrate & seed)
        working-directory: backend
        run: |
          npx prisma generate
          if [ -d prisma/migrations ] && [ "$(ls -A prisma/migrations)" ]; then
            npx prisma migrate deploy
          else
            npx prisma db push --skip-generate
          fi
          npm run prisma:seed

      - name: Build backend & frontend
        run: |
          npm --prefix backend run build
          npm --prefix frontend run build

      - name: Start Backend (:3001) and Frontend (:3000)
        run: |
          nohup env PORT=3001 NODE_ENV=production npm --prefix backend run start:prod > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          echo "Waiting for Backend API on http://localhost:3001/api/docs ..."
          for i in $(seq 1 30); do
            if curl -fsSL http://localhost:3001/api/docs >/dev/null 2>&1; then
              echo "Backend is ready."
              break
            fi
            sleep 2
          done
          curl -fsSL http://localhost:3001/api/docs >/dev/null

          nohup env PORT=3000 NODE_ENV=production npm --prefix frontend run start > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid
          echo "Waiting for Frontend UI on http://localhost:3000/login ..."
          for i in $(seq 1 30); do
            if curl -fsSL http://localhost:3000/login >/dev/null 2>&1; then
              echo "Frontend is ready."
              break
            fi
            sleep 2
          done
          curl -fsSL http://localhost:3000/login >/dev/null

      - name: "[E2E] Run Full-Stack Deep Verification Script"
        working-directory: frontend
        run: node scripts/test-frontend-deep.mjs

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "=== BACKEND LOG ==="
          cat /tmp/backend.log || true
          echo "=== FRONTEND LOG ==="
          cat /tmp/frontend.log || true

      - name: Stop background servers
        if: always()
        run: |
          [ -f /tmp/backend.pid ] && kill "$(cat /tmp/backend.pid)" || true
          [ -f /tmp/frontend.pid ] && kill "$(cat /tmp/frontend.pid)" || true
